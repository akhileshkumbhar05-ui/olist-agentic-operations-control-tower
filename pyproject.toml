[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-agentic-operations-control-tower"
version = "0.1.0"
description = "Databricks AI/BI + Agentic RAG Operations Control Tower"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
